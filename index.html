<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ পরীক্ষা</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>MCQ পরীক্ষা</h1>
        <div id="quiz-container">
            <div id="question" class="question">প্রশ্ন এখানে দেখাবে</div>
            <div id="options" class="options">
                <!-- Options will be injected here -->
            </div>
            <button id="submit-btn" class="btn">উত্তর জমা দিন</button>
            <div id="result" class="result hide"></div>
            <button id="restart-btn" class="btn hide">আবার চেষ্টা করুন</button>
        </div>
        <div class="footer">
            <p>আমাদের সাথে যুক্ত থাকুন: <a href="https://t.me/solve_with_polls" target="_blank">Solve with Polls (Telegram)</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
